[package]
name = "yuka-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Yuka engine reconstruction and binary format research tools"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
image = { version = "=0.25.10", default-features = false, features = ["png", "bmp"] }
minifb = "=0.28.0"
fontdue = "=0.9.3"
rodio = { version = "=0.20.1", default-features = false, features = ["vorbis"] }

